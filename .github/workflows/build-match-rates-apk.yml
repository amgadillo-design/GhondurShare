name: Build MatchRatesWidget APK

on:
  push:
    branches:
      - chatgpt/match-rates-widget
    paths-ignore:
      - 'matchrates/build-output/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Ensure Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: cd matchrates && gradle :app:assembleDebug --stacktrace

      - name: Save APK to branch
        run: |
          mkdir -p matchrates/build-output
          cp matchrates/app/build/outputs/apk/debug/app-debug.apk matchrates/build-output/MatchRatesWidget.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add matchrates/build-output/MatchRatesWidget.apk
          git commit -m "Build MatchRatesWidget APK [skip ci]" || exit 0
          git push origin HEAD:chatgpt/match-rates-widget
