name: Build MatchRatesWidget APK

on:
  push:
    branches:
      - chatgpt/match-rates-widget
    paths-ignore:
      - 'matchrates/build-output/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify hosted Android SDK
        run: |
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: cd matchrates && gradle :app:assembleDebug --stacktrace

      - name: Copy APK
        run: |
          mkdir -p matchrates/build-output
          cp matchrates/app/build/outputs/apk/debug/app-debug.apk matchrates/build-output/MatchRatesWidget.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MatchRatesWidget-APK
          path: matchrates/build-output/MatchRatesWidget.apk
          if-no-files-found: error

      - name: Save APK to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add matchrates/build-output/MatchRatesWidget.apk
          git commit -m "Build MatchRatesWidget APK [skip ci]" || exit 0
          git push origin HEAD:chatgpt/match-rates-widget
